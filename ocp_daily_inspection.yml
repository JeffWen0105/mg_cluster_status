---
# =============================================================================
# OCP OP Daily Inspection Playbook
# =============================================================================
# Covers:
#   1. Node Status & CSR
#   2. Machine Config Operator (MCO) Status
#   3. ETCD Health
#   4. Default Ingress Certificate
#
# Requirements:
#   collections:
#     - kubernetes.core
#
# Authentication (choose one):
#   Option A) kubeconfig file:
#       ansible-playbook ocp_daily_inspection.yml -e kubeconfig=/path/to/kubeconfig
#   Option B) cert/key/CA:
#       ansible-playbook ocp_daily_inspection.yml \
#         -e ocp_api_url=https://api.cluster.example.com:6443 \
#         -e ocp_client_cert=/path/to/admin.crt \
#         -e ocp_client_key=/path/to/admin.key \
#         -e ocp_ca_cert=/path/to/ca.crt
#
# Output guide (visible in AAP job output):
#   Each section prints a formatted block.
#   [OK]   = normal, no action needed
#   [WARN] = attention required, investigate soon
#   [CRIT] = immediate action required
#   The final task prints a one-page CLUSTER HEALTH SUMMARY.
# =============================================================================

- name: OCP OP Daily Inspection
  hosts: localhost
  gather_facts: false

  vars:
    # --- Authentication (Option A: kubeconfig) --------------------------------
    kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(omit) }}"

    # --- Authentication (Option B: cert / key / CA) --------------------------
    # ocp_api_url: "https://api.cluster.example.com:6443"
    # ocp_client_cert: "/path/to/admin.crt"
    # ocp_client_key: "/path/to/admin.key"
    # ocp_ca_cert: "/path/to/ca.crt"

    # --- Thresholds -----------------------------------------------------------
    cert_warning_days: 30   # warn when certificate expires within this many days

    # Node resource thresholds (percentage, 0-100)
    node_cpu_warn_pct:    80   # [WARN] when node CPU usage exceeds this %
    node_cpu_crit_pct:    90   # [CRIT] when node CPU usage exceeds this %
    node_memory_warn_pct: 85   # [WARN] when node memory usage exceeds this %
    node_memory_crit_pct: 95   # [CRIT] when node memory usage exceeds this %

  # ---------------------------------------------------------------------------
  # Common connection arguments built dynamically so both auth options work.
  # ---------------------------------------------------------------------------
  pre_tasks:
    - name: Build k8s connection arguments
      ansible.builtin.set_fact:
        k8s_auth: >-
          {{
            (kubeconfig is defined and kubeconfig)
            | ternary(
                {'kubeconfig': kubeconfig},
                {
                  'host':        ocp_api_url,
                  'client_cert': ocp_client_cert,
                  'client_key':  ocp_client_key,
                  'ca_cert':     ocp_ca_cert,
                  'validate_certs': true
                }
              )
          }}

    - name: Initialise issue tracker
      ansible.builtin.set_fact:
        _issues: []

    - name: ">>> Inspection START <<<"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "  OCP Cluster Daily Inspection"
          - "  Time    : {{ now(utc=true, fmt='%Y-%m-%d %H:%M UTC') }}"
          - "============================================================"
          - "  Checks  : 1=Nodes/CSR  2=MCO  3=ETCD  4=Ingress Cert  5=Resources"
          - "------------------------------------------------------------"
          - "  How to read this output:"
          - "    [OK]   = Normal, no action needed"
          - "    [WARN] = Investigate soon"
          - "    [CRIT] = Immediate action required"
          - "  >>> Scroll to the bottom for the SUMMARY <<<  "
          - "============================================================"

  tasks:

    # =========================================================================
    # 1. NODE STATUS
    # =========================================================================
    - name: "[1/5 NODE] Get all nodes"
      kubernetes.core.k8s_info:
        kind: Node
        api_version: v1
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: nodes_result

    - name: "[1/5 NODE] Build per-node display line"
      ansible.builtin.set_fact:
        _node_lines: >-
          {{
            _node_lines | default([]) + [
              ('[OK]   ' if _ready == 'True' else '[CRIT] ')
              + item.metadata.name
              + '  roles=' + _roles
              + '  Ready=' + _ready
            ]
          }}
      vars:
        _ready: >-
          {{ item.status.conditions
             | selectattr('type', 'equalto', 'Ready')
             | map(attribute='status') | first | string }}
        _roles: >-
          {{ item.metadata.labels
             | dict2items
             | selectattr('key', 'match', '^node-role.kubernetes.io/')
             | map(attribute='key')
             | map('regex_replace', '^node-role.kubernetes.io/', '')
             | join(',') | string }}
      loop: "{{ nodes_result.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: "[1/5 NODE] Track not-ready nodes"
      ansible.builtin.set_fact:
        _issues: >-
          {{
            _issues + [
              '[CRIT] Node ' + item.metadata.name + ' NOT Ready'
              + ' (since ' + (item.status.conditions
                              | selectattr('type', 'equalto', 'Ready')
                              | map(attribute='lastTransitionTime') | first) + ')'
            ]
          }}
      loop: "{{ nodes_result.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: >-
        (item.status.conditions
          | selectattr('type', 'equalto', 'Ready')
          | map(attribute='status') | first | string) != 'True'

    - name: "[1/5 NODE] Get pending / unapproved CSRs"
      kubernetes.core.k8s_info:
        api_version: certificates.k8s.io/v1
        kind: CertificateSigningRequest
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: csr_result

    - name: "[1/5 NODE] Build pending CSR display lines"
      ansible.builtin.set_fact:
        _csr_lines: >-
          {{
            _csr_lines | default([]) + [
              '[WARN] ' + item.metadata.name
              + '  signer=' + item.spec.signerName
              + '  requestor=' + item.spec.username
              + '  created=' + item.metadata.creationTimestamp
            ]
          }}
        _issues: >-
          {{
            _issues + [
              '[WARN] Pending CSR: ' + item.metadata.name
              + ' (requestor=' + item.spec.username + ')'
            ]
          }}
      loop: "{{ csr_result.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: >-
        item.status.conditions is not defined or item.status.conditions | length == 0

    - name: "[1/5 NODE] Section report"
      ansible.builtin.debug:
        msg: >-
          {{
            ['',
             '============================================================',
             '  [1/5] NODE STATUS',
             '  Purpose : All nodes must be Ready for workloads to run.',
             '            Pending CSRs block node bootstrapping and cert',
             '            renewal -- approve or investigate promptly.',
             '------------------------------------------------------------',
             '  Nodes (' + (nodes_result.resources | length | string) + ' total):']
            + (_node_lines | default(['  (no nodes found)']))
            + ['------------------------------------------------------------',
               '  Pending CSRs (' + ((_csr_lines | default([])) | length | string) + '):']
            + (_csr_lines | default(['  [OK]   None']))
            + ['============================================================', '']
          }}

    # =========================================================================
    # 2. MACHINE CONFIG OPERATOR STATUS
    # =========================================================================
    - name: "[2/5 MCO] Get MachineConfigPools"
      kubernetes.core.k8s_info:
        api_version: machineconfiguration.openshift.io/v1
        kind: MachineConfigPool
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: mcp_result

    - name: "[2/5 MCO] Build MachineConfigPool display lines"
      ansible.builtin.set_fact:
        _mcp_lines: >-
          {{
            _mcp_lines | default([]) + [
              ('[OK]   ' if _degraded != 'True' else '[CRIT] ')
              + item.metadata.name
              + '  updated=' + _updated
              + '  updating=' + _updating
              + '  degraded=' + _degraded
              + '  machines=' + (item.status.machineCount | string)
              + '  ready=' + (item.status.readyMachineCount | string)
            ]
          }}
        _issues: >-
          {{
            _issues + (
              ['[CRIT] MachineConfigPool ' + item.metadata.name
               + ' is DEGRADED (degradedMachineCount='
               + (item.status.degradedMachineCount | string) + ')']
              if _degraded == 'True' else []
            )
          }}
      vars:
        _updated: >-
          {{ item.status.conditions | selectattr('type', 'equalto', 'Updated')
             | map(attribute='status') | first | string | default('Unknown') }}
        _updating: >-
          {{ item.status.conditions | selectattr('type', 'equalto', 'Updating')
             | map(attribute='status') | first | string | default('Unknown') }}
        _degraded: >-
          {{ item.status.conditions | selectattr('type', 'equalto', 'Degraded')
             | map(attribute='status') | first | string | default('Unknown') }}
      loop: "{{ mcp_result.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: "[2/5 MCO] Build per-node MCO sync display lines"
      ansible.builtin.set_fact:
        _mco_node_lines: >-
          {{
            _mco_node_lines | default([]) + [
              ('[OK]   ' if _in_sync else '[WARN] ')
              + item.metadata.name
              + '  state=' + _state
              + '  in_sync=' + (_in_sync | string)
            ]
          }}
        _issues: >-
          {{
            _issues + (
              ['[WARN] Node ' + item.metadata.name
               + ' MCO config out of sync (state=' + _state + ')']
              if not _in_sync else []
            )
          }}
      vars:
        _current: >-
          {{ item.metadata.annotations['machineconfiguration.openshift.io/currentConfig']
             | default('') }}
        _desired: >-
          {{ item.metadata.annotations['machineconfiguration.openshift.io/desiredConfig']
             | default('') }}
        _state: >-
          {{ item.metadata.annotations['machineconfiguration.openshift.io/state']
             | default('N/A') }}
        _in_sync: "{{ _current != '' and _current == _desired }}"
      loop: "{{ nodes_result.resources }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: "[2/5 MCO] Section report"
      ansible.builtin.debug:
        msg: >-
          {{
            ['',
             '============================================================',
             '  [2/5] MACHINE CONFIG OPERATOR (MCO) STATUS',
             '  Purpose : MCO applies OS-level config (kernel args, certs,',
             '            etc.) to every node via MachineConfigPools.',
             '            A degraded pool or out-of-sync node needs',
             '            investigation before applying further changes.',
             '------------------------------------------------------------',
             '  MachineConfigPools (' + (mcp_result.resources | length | string) + '):']
            + (_mcp_lines | default(['  (none found)']))
            + ['------------------------------------------------------------',
               '  Per-node MCO config sync:']
            + (_mco_node_lines | default(['  (none found)']))
            + ['============================================================', '']
          }}

    # =========================================================================
    # 3. ETCD STATUS
    # =========================================================================
    - name: "[3/5 ETCD] Get etcd pods (openshift-etcd)"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: openshift-etcd
        label_selectors:
          - "k8s-app=etcd"
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: etcd_pods_result

    - name: "[3/5 ETCD] Select a Running etcd pod"
      ansible.builtin.set_fact:
        etcd_pod_name: >-
          {{
            etcd_pods_result.resources
            | selectattr('status.phase', 'equalto', 'Running')
            | map(attribute='metadata.name')
            | first
          }}

    - name: "[3/5 ETCD] etcdctl endpoint health"
      kubernetes.core.k8s_exec:
        namespace: openshift-etcd
        pod: "{{ etcd_pod_name }}"
        container: etcdctl
        command: "etcdctl endpoint health -w table"
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: etcd_health_result

    - name: "[3/5 ETCD] etcdctl endpoint status"
      kubernetes.core.k8s_exec:
        namespace: openshift-etcd
        pod: "{{ etcd_pod_name }}"
        container: etcdctl
        command: "etcdctl endpoint status -w table"
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: etcd_status_result

    - name: "[3/5 ETCD] etcdctl member list"
      kubernetes.core.k8s_exec:
        namespace: openshift-etcd
        pod: "{{ etcd_pod_name }}"
        container: etcdctl
        command: "etcdctl member list -w table"
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: etcd_members_result

    - name: "[3/5 ETCD] Track unhealthy endpoints"
      ansible.builtin.set_fact:
        _etcd_health_ok: "{{ 'false' not in (etcd_health_result.stdout | lower) }}"
        _issues: >-
          {{
            _issues + (
              ['[CRIT] ETCD endpoint health reports unhealthy member(s)'
               + ' -- see Section 3 output above']
              if 'false' in (etcd_health_result.stdout | lower) else []
            )
          }}

    - name: "[3/5 ETCD] Section report"
      ansible.builtin.debug:
        msg: >-
          {{
            ['',
             '============================================================',
             '  [3/5] ETCD STATUS',
             '  Purpose : ETCD is the cluster state database. All members',
             '            must be healthy and a leader must be elected.',
             '            Quorum loss (< 2 of 3 healthy) causes API downtime.',
             '            healthy=true = OK  |  isLeader=true = current leader',
             '------------------------------------------------------------',
             '  Endpoint Health (all members should show healthy=true):']
            + etcd_health_result.stdout_lines
            + ['',
               '  Endpoint Status (DB size, raftTerm, leader):']
            + etcd_status_result.stdout_lines
            + ['',
               '  Member List:']
            + etcd_members_result.stdout_lines
            + ['============================================================', '']
          }}

    # =========================================================================
    # 4. Default Ingress Certificate
    # =========================================================================
    - name: "[4/5 CERT] Get default IngressController"
      kubernetes.core.k8s_info:
        api_version: operator.openshift.io/v1
        kind: IngressController
        namespace: openshift-ingress-operator
        name: default
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: ingress_ctrl_result

    - name: "[4/5 CERT] Resolve certificate secret name"
      ansible.builtin.set_fact:
        ingress_cert_secret_name: >-
          {{
            ingress_ctrl_result.resources[0].spec.defaultCertificate.name
            | default('router-certs-default')
            if (ingress_ctrl_result.resources[0].spec.defaultCertificate is defined
                and ingress_ctrl_result.resources[0].spec.defaultCertificate.name is defined
                and ingress_ctrl_result.resources[0].spec.defaultCertificate.name != None)
            else 'router-certs-default'
          }}

    - name: "[4/5 CERT] Get certificate secret from openshift-ingress"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: openshift-ingress
        name: "{{ ingress_cert_secret_name }}"
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: ingress_secret_result

    - name: "[4/5 CERT] Decode tls.crt from secret"
      ansible.builtin.set_fact:
        ingress_tls_crt: >-
          {{ ingress_secret_result.resources[0].data['tls.crt'] | b64decode }}
      when: >-
        ingress_secret_result.resources | length > 0
        and ingress_secret_result.resources[0].data['tls.crt'] is defined

    - name: "[4/5 CERT] Track missing secret"
      ansible.builtin.set_fact:
        _issues: >-
          {{
            _issues + [
              '[CRIT] Ingress cert secret ' + ingress_cert_secret_name
              + ' not found in namespace openshift-ingress'
            ]
          }}
      when: >-
        ingress_secret_result.resources | length == 0
        or ingress_secret_result.resources[0].data['tls.crt'] is not defined

    - name: "[4/5 CERT] Create temp file for certificate"
      ansible.builtin.tempfile:
        state: file
        suffix: .crt
      register: ingress_cert_tmp
      when: ingress_tls_crt is defined

    - name: "[4/5 CERT] Write cert to temp file"
      ansible.builtin.copy:
        content: "{{ ingress_tls_crt }}"
        dest: "{{ ingress_cert_tmp.path }}"
        mode: '0600'
      when: ingress_tls_crt is defined and ingress_cert_tmp is defined

    - name: "[4/5 CERT] Inspect certificate with openssl"
      # Requires GNU date (Linux / RHEL). openssl called once; notAfter parsed from its output.
      ansible.builtin.shell: |
        set -e
        CERT="{{ ingress_cert_tmp.path }}"
        OUT=$(openssl x509 -noout -subject -issuer -dates -ext subjectAltName -in "$CERT")
        echo "$OUT"
        END_DATE=$(echo "$OUT" | grep '^notAfter=' | cut -d= -f2)
        END_EPOCH=$(date -d "$END_DATE" +%s)
        NOW_EPOCH=$(date +%s)
        echo "days_remaining=$(( (END_EPOCH - NOW_EPOCH) / 86400 ))"
      register: ingress_cert_raw
      when: ingress_tls_crt is defined and ingress_cert_tmp is defined

    - name: "[4/5 CERT] Parse days remaining"
      ansible.builtin.set_fact:
        ingress_cert_days_remaining: >-
          {{
            ingress_cert_raw.stdout_lines
            | select('match', '^days_remaining=')
            | map('regex_replace', '^days_remaining=', '')
            | first | int
          }}
      when: ingress_tls_crt is defined and ingress_cert_raw is defined

    - name: "[4/5 CERT] Track certificate issues"
      ansible.builtin.set_fact:
        _issues: >-
          {{
            _issues + (
              ['[CRIT] Ingress certificate EXPIRED! (secret=' + ingress_cert_secret_name + ')']
              if ingress_cert_days_remaining | int <= 0
              else (
                ['[WARN] Ingress certificate expires in '
                 + (ingress_cert_days_remaining | string) + ' days'
                 + ' (threshold=' + (cert_warning_days | string) + ')']
                if ingress_cert_days_remaining | int < cert_warning_days | int
                else []
              )
            )
          }}
      when: ingress_cert_days_remaining is defined

    - name: "[4/5 CERT] Section report"
      ansible.builtin.debug:
        msg: >-
          {{
            ['',
             '============================================================',
             '  [4/5] DEFAULT INGRESS CERTIFICATE',
             '  Purpose : The wildcard cert covers *.apps.<cluster>.',
             '            An expired cert instantly breaks HTTPS on all',
             '            routes. Plan renewal at least 30 days before expiry.',
             '------------------------------------------------------------',
             '  Secret  : ' + ingress_cert_secret_name
             + '  (namespace: openshift-ingress)']
            + (
                (ingress_cert_raw.stdout_lines
                 | default([])
                 | reject('match', '^days_remaining=')
                 | list)
                + ['',
                   '  Days remaining : ' + (ingress_cert_days_remaining | string),
                   '  Status         : '
                   + (
                       '[CRIT] EXPIRED - renew immediately!'
                       if ingress_cert_days_remaining | int <= 0
                       else (
                         '[WARN] Expiring in ' + (ingress_cert_days_remaining | string)
                         + ' days - plan renewal now'
                         if ingress_cert_days_remaining | int < cert_warning_days | int
                         else '[OK]   Valid for ' + (ingress_cert_days_remaining | string)
                              + ' more days'
                       )
                     )]
                if ingress_cert_days_remaining is defined
                else ['  [CRIT] Certificate secret not found or has no tls.crt data.']
              )
            + ['============================================================', '']
          }}

    - name: "[4/5 CERT] Remove temp cert file"
      ansible.builtin.file:
        path: "{{ ingress_cert_tmp.path }}"
        state: absent
      when: ingress_cert_tmp is defined and ingress_cert_tmp.path is defined

    # =========================================================================
    # 5. NODE RESOURCE USAGE (CPU / Memory / Disk)
    # =========================================================================
    # CPU + Memory: fetched from the Kubernetes Metrics API (requires metrics-server,
    #               which is included by default in OpenShift).
    #               Usage % = usage / allocatable × 100.
    # Disk        : Derived from the kubelet-managed DiskPressure node condition.
    #               DiskPressure=True means the kubelet has crossed its eviction
    #               threshold (default ≥ 90 % used); no extra tooling required.
    # =========================================================================

    - name: "[5/5 RESOURCE] Get NodeMetrics (CPU + Memory)"
      kubernetes.core.k8s_info:
        api_version: metrics.k8s.io/v1beta1
        kind: NodeMetrics
        kubeconfig: "{{ k8s_auth.kubeconfig | default(omit) }}"
        host: "{{ k8s_auth.host | default(omit) }}"
        client_cert: "{{ k8s_auth.client_cert | default(omit) }}"
        client_key: "{{ k8s_auth.client_key | default(omit) }}"
        ca_cert: "{{ k8s_auth.ca_cert | default(omit) }}"
        validate_certs: "{{ k8s_auth.validate_certs | default(omit) }}"
      register: node_metrics_result
      ignore_errors: true

    - name: "[5/5 RESOURCE] Build per-node resource display lines and track alerts"
      ansible.builtin.set_fact:
        _resource_lines: >-
          {{
            _resource_lines | default([]) + [
              _level
              + item.metadata.name
              + '  cpu=' + (_cpu_pct | string) + '%'
              + '  mem=' + (_mem_pct | string) + '%'
              + '  disk=' + _disk_status
            ]
          }}
        _issues: >-
          {{
            _issues
            + (
                ['[CRIT] Node ' + item.metadata.name + ' CPU CRITICAL ('
                 + (_cpu_pct | string) + '% >= ' + (node_cpu_crit_pct | string) + '%)']
                if _cpu_pct | int >= node_cpu_crit_pct | int else []
              )
            + (
                ['[WARN] Node ' + item.metadata.name + ' CPU high ('
                 + (_cpu_pct | string) + '% >= ' + (node_cpu_warn_pct | string) + '%)']
                if (_cpu_pct | int >= node_cpu_warn_pct | int
                    and _cpu_pct | int < node_cpu_crit_pct | int) else []
              )
            + (
                ['[CRIT] Node ' + item.metadata.name + ' Memory CRITICAL ('
                 + (_mem_pct | string) + '% >= ' + (node_memory_crit_pct | string) + '%)']
                if _mem_pct | int >= node_memory_crit_pct | int else []
              )
            + (
                ['[WARN] Node ' + item.metadata.name + ' Memory high ('
                 + (_mem_pct | string) + '% >= ' + (node_memory_warn_pct | string) + '%)']
                if (_mem_pct | int >= node_memory_warn_pct | int
                    and _mem_pct | int < node_memory_crit_pct | int) else []
              )
            + (
                ['[CRIT] Node ' + item.metadata.name
                 + ' DiskPressure detected (kubelet eviction threshold crossed)']
                if _disk_pressure == 'True' else []
              )
          }}
      vars:
        # ── find allocatable values from the already-fetched nodes list ─────
        _node_info: >-
          {{ nodes_result.resources
             | selectattr('metadata.name', 'equalto', item.metadata.name)
             | first }}

        # ── CPU: convert to millicores ───────────────────────────────────────
        # usage.cpu may be: "500m" | "2" | "1234567890n"
        _cpu_usage_m: >-
          {{
            (item.usage.cpu | regex_replace('n$', '') | int // 1000000)
            if (item.usage.cpu | string | regex_search('n$'))
            else (
              (item.usage.cpu | regex_replace('m$', '') | int)
              if (item.usage.cpu | string | regex_search('m$'))
              else (item.usage.cpu | int * 1000)
            )
          }}
        # allocatable.cpu may be: "4" | "4000m"
        _cpu_alloc_m: >-
          {{
            (_node_info.status.allocatable.cpu | regex_replace('m$', '') | int)
            if (_node_info.status.allocatable.cpu | string | regex_search('m$'))
            else (_node_info.status.allocatable.cpu | int * 1000)
          }}
        _cpu_pct: >-
          {{ ((_cpu_usage_m | float * 100) / (_cpu_alloc_m | float)) | round | int if (_cpu_alloc_m | int) > 0 else 0 }}

        # ── Memory: convert to KiB ───────────────────────────────────────────
        # usage.memory / allocatable.memory may be: "4096Ki" | "4Mi" | "4Gi" | raw bytes
        _mem_usage_ki: >-
          {{
            (item.usage.memory | regex_replace('Ki$', '') | int)
            if (item.usage.memory | string | regex_search('Ki$'))
            else (
              (item.usage.memory | regex_replace('Mi$', '') | int * 1024)
              if (item.usage.memory | string | regex_search('Mi$'))
              else (
                (item.usage.memory | regex_replace('Gi$', '') | int * 1048576)
                if (item.usage.memory | string | regex_search('Gi$'))
                else (item.usage.memory | int // 1024)
              )
            )
          }}
        _mem_alloc_ki: >-
          {{
            (_node_info.status.allocatable.memory | regex_replace('Ki$', '') | int)
            if (_node_info.status.allocatable.memory | string | regex_search('Ki$'))
            else (
              (_node_info.status.allocatable.memory | regex_replace('Mi$', '') | int * 1024)
              if (_node_info.status.allocatable.memory | string | regex_search('Mi$'))
              else (
                (_node_info.status.allocatable.memory | regex_replace('Gi$', '') | int * 1048576)
                if (_node_info.status.allocatable.memory | string | regex_search('Gi$'))
                else (_node_info.status.allocatable.memory | int // 1024)
              )
            )
          }}
        _mem_pct: >-
          {{ ((_mem_usage_ki | float * 100) / (_mem_alloc_ki | float)) | round | int if (_mem_alloc_ki | int) > 0 else 0 }}

        # ── Disk: kubelet DiskPressure condition ─────────────────────────────
        _disk_pressure: >-
          {{ _node_info.status.conditions
             | selectattr('type', 'equalto', 'DiskPressure')
             | map(attribute='status') | first | string }}
        _disk_status: "{{ 'PRESSURE' if _disk_pressure == 'True' else 'OK' }}"

        # ── Severity level ───────────────────────────────────────────────────
        _level: >-
          {{
            '[CRIT] ' if (
              (_cpu_pct | int >= node_cpu_crit_pct | int)
              or (_mem_pct | int >= node_memory_crit_pct | int)
              or _disk_pressure == 'True'
            )
            else (
              '[WARN] ' if (
                (_cpu_pct | int >= node_cpu_warn_pct | int)
                or (_mem_pct | int >= node_memory_warn_pct | int)
              )
              else '[OK]   '
            )
          }}

      loop: >-
        {{
          node_metrics_result.resources
          | default([])
          | sort(attribute='metadata.name')
        }}
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: "[5/5 RESOURCE] Section report"
      ansible.builtin.debug:
        msg: >-
          {{
            ['',
             '============================================================',
             '  [5/5] NODE RESOURCE USAGE',
             '  Purpose : Identify nodes under CPU, memory, or disk pressure.',
             '  Thresholds used:',
             '    CPU    WARN >= ' + (node_cpu_warn_pct | string) + '%'
             + '  CRIT >= ' + (node_cpu_crit_pct | string) + '%',
             '    Memory WARN >= ' + (node_memory_warn_pct | string) + '%'
             + '  CRIT >= ' + (node_memory_crit_pct | string) + '%',
             '    Disk   DiskPressure condition (kubelet eviction threshold)',
             '------------------------------------------------------------']
            + (
                _resource_lines | default(['  (metrics-server unavailable -- skipped)'])
              )
            + ['============================================================', '']
          }}


    - name: ">>> CLUSTER HEALTH SUMMARY <<<"
      ansible.builtin.debug:
        msg: >-
          {{
            ['',
             '============================================================',
             '  OCP CLUSTER DAILY INSPECTION - SUMMARY',
             '  Completed : ' + now(utc=true, fmt='%Y-%m-%d %H:%M UTC'),
             '============================================================',
             '  OVERALL STATUS : '
             + ('** ALL CLEAR - No issues detected **'
                if _issues | length == 0
                else ('** ' + (_issues | length | string) + ' ISSUE(S) FOUND **')),
             '------------------------------------------------------------',
             '  Nodes       : '
             + ((_node_lines | default([]) | select('match', '^\[OK\]') | list | length) | string)
             + ' / ' + (nodes_result.resources | length | string) + ' Ready'
             + ('  [OK]'
                if (_node_lines | default([]) | select('match', '^\[CRIT\]') | list | length) == 0
                else '  [CRIT]'),
             '  CSR         : '
             + ((_csr_lines | default([])) | length | string) + ' pending'
             + ('  [OK]'
                if (_csr_lines | default([]) | length) == 0
                else '  [WARN]'),
             '  MCO Pools   : '
             + ((_mcp_lines | default([]) | select('match', '^\[OK\]') | list | length) | string)
             + ' / ' + (_mcp_lines | default([]) | length | string) + ' healthy'
             + ('  [OK]'
                if (_mcp_lines | default([]) | select('match', '^\[CRIT\]') | list | length) == 0
                else '  [CRIT]'),
             '  MCO Nodes   : '
             + ((_mco_node_lines | default([]) | select('match', '^\[OK\]') | list | length) | string)
             + ' / ' + (_mco_node_lines | default([]) | length | string) + ' in-sync'
             + ('  [OK]'
                if (_mco_node_lines | default([]) | select('match', '^\[WARN\]') | list | length) == 0
                else '  [WARN]'),
             '  ETCD        : '
             + ('[OK]   All endpoints healthy'
                if (_etcd_health_ok | default(true))
                else '[CRIT] Unhealthy endpoint(s) detected'),
             '  Ingress Cert: '
             + (
                 '[OK]   ' + (ingress_cert_days_remaining | string) + ' days remaining'
                 if ingress_cert_days_remaining is defined
                    and ingress_cert_days_remaining | int > cert_warning_days | int
                 else (
                   '[WARN] ' + (ingress_cert_days_remaining | string) + ' days remaining'
                   if ingress_cert_days_remaining is defined
                      and ingress_cert_days_remaining | int > 0
                   else (
                     '[CRIT] EXPIRED'
                     if ingress_cert_days_remaining is defined
                        and ingress_cert_days_remaining | int <= 0
                     else '[CRIT] Secret not found'
                   )
                 )
               ),
             '  Resources   : '
             + (
                 'metrics unavailable (metrics-server may not be installed)'
                 if (node_metrics_result is not defined
                     or node_metrics_result.failed | default(false)
                     or node_metrics_result.resources | default([]) | length == 0)
                 else (
                   '[CRIT] ' + (_resource_lines | default([]) | select('match', '^\[CRIT\]') | list | length | string)
                   + ' node(s) with critical resource usage'
                   if (_resource_lines | default([]) | select('match', '^\[CRIT\]') | list | length) > 0
                   else (
                     '[WARN] ' + (_resource_lines | default([]) | select('match', '^\[WARN\]') | list | length | string)
                     + ' node(s) with high resource usage'
                     if (_resource_lines | default([]) | select('match', '^\[WARN\]') | list | length) > 0
                     else '[OK]   All ' + (_resource_lines | default([]) | length | string)
                          + ' nodes within thresholds'
                   )
                 )
               ),
             '------------------------------------------------------------']
            + (
                ['  Issues found:']
                + (_issues | map('regex_replace', '^', '    ') | list)
                if _issues | length > 0
                else ['  No issues detected.']
              )
            + ['============================================================',
               '  Tip: Search for [CRIT] or [WARN] in this job output',
               '       to jump directly to problem details.',
               '============================================================', '']
          }}
